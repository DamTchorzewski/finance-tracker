# Build & Deploy: CI and a build on every push to develop and main; main also deploys the build to Firebase Hosting.
#
# Triggers:
#   - push to main     → CI (with e2e), build, deploy to Firebase Hosting, health check,
#   - push to develop  → CI (without e2e, the pull request ran it), build (artifact to look at), no deploy,
#   - manual run       → the same as the branch it is run from.
# Documentation-only pushes start nothing.
#
# Firebase Hosting serves dist/ with the headers of firebase.json and rewrites /api/** to the Cloud Run service
# finance-tracker-api (repository finance-tracker-api). Sign-in to Google: Workload Identity Federation, no key in
# GitHub; setup in docs/deployment.md.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables), read by the build; none is a secret,
# they are the public settings of the Firebase web app. Without them the build works and only the demo can be used:
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID,
#   VITE_FIREBASE_MESSAGING_SENDER_ID
# Environment "production" (deployment branches: main only), variables only:
#   GCP_PROJECT_ID                  the Google Cloud / Firebase project id
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github-provider
#   GCP_SERVICE_ACCOUNT             github-deployer@<project>.iam.gserviceaccount.com
#   SITE_URL                        the address of the app, e.g. https://<project>.web.app
# Standard: reops/standards/workflows.md and firebase-hosting.md (global, outside this repo)

name: Build & Deploy

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "**/.env.example"
      - ".github/dependabot.yml"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      e2e: ${{ github.ref == 'refs/heads/main' }}

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.run_id }}
          path: dist/
          retention-days: 14

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ github.run_id }}
          path: dist/

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # firebase-tools reads the credentials the auth step wrote (GOOGLE_APPLICATION_CREDENTIALS)
      - name: Deploy
        run: pnpm dlx firebase-tools@15.37.0 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

      - name: Health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/health-check.ts
