<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><style>
.gb-ray{fill:none;stroke:var(--ill-accent,#943593);stroke-width:6;stroke-linecap:round;opacity:0;animation:gb-ray 800ms cubic-bezier(.22,.85,.3,1) both}
.gb-gold{stroke:var(--ill-coin,#f1ba4b)}
.gb-coin{opacity:0;animation:gb-coin 1000ms cubic-bezier(.22,.85,.3,1) both}
.gb-face{fill:var(--ill-coin,#f1ba4b)}.gb-rim{fill:none;stroke:var(--ill-coin-deep,#ad721c);stroke-width:1.8}
.gb-ring{fill:none;stroke:var(--ill-accent,#943593);stroke-width:4;opacity:0;transform-origin:100px 100px;animation:gb-ring 700ms ease-out both}
@keyframes gb-ray{0%{opacity:0;transform:translateX(-18px)}20%{opacity:1}100%{opacity:0;transform:translateX(26px)}}
@keyframes gb-coin{0%{opacity:0;transform:translateX(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateX(62px) scale(1)}}
@keyframes gb-ring{0%{opacity:.7;transform:scale(.5)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.gb-ray,.gb-coin,.gb-ring{animation:none;opacity:0}}
</style>
<circle class="gb-ring" cx="100" cy="100" r="52"/><g transform="rotate(0 100 100)"><path class="gb-ray" style="animation-delay:0ms" d="M128 100 H146"/></g><g transform="rotate(30 100 100)"><path class="gb-ray gb-gold" style="animation-delay:40ms" d="M128 100 H140"/></g><g transform="rotate(60 100 100)"><path class="gb-ray" style="animation-delay:80ms" d="M128 100 H146"/></g><g transform="rotate(90 100 100)"><path class="gb-ray gb-gold" style="animation-delay:0ms" d="M128 100 H140"/></g><g transform="rotate(120 100 100)"><path class="gb-ray" style="animation-delay:40ms" d="M128 100 H146"/></g><g transform="rotate(150 100 100)"><path class="gb-ray gb-gold" style="animation-delay:80ms" d="M128 100 H140"/></g><g transform="rotate(180 100 100)"><path class="gb-ray" style="animation-delay:0ms" d="M128 100 H146"/></g><g transform="rotate(210 100 100)"><path class="gb-ray gb-gold" style="animation-delay:40ms" d="M128 100 H140"/></g><g transform="rotate(240 100 100)"><path class="gb-ray" style="animation-delay:80ms" d="M128 100 H146"/></g><g transform="rotate(270 100 100)"><path class="gb-ray gb-gold" style="animation-delay:0ms" d="M128 100 H140"/></g><g transform="rotate(300 100 100)"><path class="gb-ray" style="animation-delay:40ms" d="M128 100 H146"/></g><g transform="rotate(330 100 100)"><path class="gb-ray gb-gold" style="animation-delay:80ms" d="M128 100 H140"/></g><g transform="rotate(15 100 100)"><g class="gb-coin" style="animation-delay:60ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g><g transform="rotate(75 100 100)"><g class="gb-coin" style="animation-delay:90ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g><g transform="rotate(135 100 100)"><g class="gb-coin" style="animation-delay:120ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g><g transform="rotate(195 100 100)"><g class="gb-coin" style="animation-delay:150ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g><g transform="rotate(255 100 100)"><g class="gb-coin" style="animation-delay:180ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g><g transform="rotate(315 100 100)"><g class="gb-coin" style="animation-delay:210ms"><circle class="gb-face" cx="118" cy="100" r="7"/><circle class="gb-rim" cx="118" cy="100" r="4.4"/></g></g></svg>
